<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOL-Mini 远程唤醒</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { max-width: 400px; width: 100%; padding: 20px; }

        /* 登录面板 */
        .login-panel {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            color: #1e293b;
        }
        .login-panel h2 { margin-bottom: 20px; color: #22c55e; }
        .login-panel .logo { font-size: 48px; color: #22c55e; margin-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; color: #64748b; font-size: 13px; margin-bottom: 6px; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            background: #f8fafc;
        }
        .input-group input:focus { outline: none; border-color: #22c55e; }
        .connect-btn {
            width: 100%;
            padding: 14px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .connect-btn:hover { background: #16a34a; }
        .connect-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .login-hint { color: #94a3b8; font-size: 12px; margin-top: 15px; }

        /* 主面板 */
        .main-panel { display: none; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            margin-bottom: 20px;
            color: #1e293b;
        }
        .header h1 { font-size: 18px; }
        .logout-btn {
            background: #f1f5f9;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            color: #64748b;
        }

        /* 控制按钮 */
        .control-buttons { display: flex; gap: 15px; margin-bottom: 20px; }
        .control-btn {
            flex: 1;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
        }
        .control-btn:hover { transform: translateY(-2px); }
        .wake-btn { background: #22c55e; color: white; }
        .sleep-btn { background: #f97316; color: white; }
        .btn-icon { font-size: 32px; margin-bottom: 8px; }
        .btn-label { font-size: 14px; }

        /* 状态卡片 */
        .status-card {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            color: #1e293b;
        }
        .status-title { font-size: 18px; margin-bottom: 15px; }
        .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .status-badge { padding: 6px 12px; border-radius: 6px; font-size: 12px; }
        .online { background: #22c55e; color: white; }
        .offline { background: #ef4444; color: white; }
        .connecting { background: #3b82f6; color: white; }

        /* Toast提示 */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        .toast.show { opacity: 1; }
        .toast.success { background: #22c55e; color: white; }
        .toast.error { background: #ef4444; color: white; }
        .toast.info { background: #3b82f6; color: white; }

        /* 连接状态指示 */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
        }
        .status-dot.connected { background: #22c55e; }
        .status-dot.connecting { background: #3b82f6; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录面板 -->
        <div class="login-panel" id="loginPanel">
            <div class="logo"><i class="fas fa-power-off"></i></div>
            <h2>WOL-Mini 远程唤醒</h2>
            <form onsubmit="handleConnect(event)">
                <div class="input-group">
                    <label><i class="fas fa-microchip"></i> 设备 ID</label>
                    <input type="text" id="deviceId" placeholder="例如: wol-a1b2c3" required>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-key"></i> 控制Token</label>
                    <input type="password" id="token" placeholder="请输入控制密码" required>
                </div>
                <button type="submit" class="connect-btn" id="connectBtn">
                    <i class="fas fa-link"></i> 连接设备
                </button>
            </form>
            <p class="login-hint">设备ID和Token在配网时设置</p>
        </div>

        <!-- 主控制面板 -->
        <div class="main-panel" id="mainPanel">
            <div class="header">
                <h1><i class="fas fa-power-off" style="color:#22c55e"></i> WOL-Mini</h1>
                <button class="logout-btn" onclick="disconnect()">
                    <i class="fas fa-sign-out-alt"></i> 断开
                </button>
            </div>

            <!-- 连接状态 -->
            <div class="status-card">
                <div class="connection-status">
                    <div class="status-dot" id="mqttDot"></div>
                    <span id="mqttStatus">未连接</span>
                </div>
                <div class="status-title">设备状态</div>
                <div class="status-row">
                    <span>ESP32:</span>
                    <span class="status-badge offline" id="esp32Status">离线</span>
                </div>
                <div class="status-row">
                    <span>IP:</span>
                    <span id="esp32Ip">-</span>
                </div>
            </div>

            <!-- 控制按钮 -->
            <div class="control-buttons">
                <button class="control-btn wake-btn" onclick="sendWake()" id="wakeBtn">
                    <div class="btn-icon"><i class="fas fa-power-off"></i></div>
                    <div class="btn-label">唤醒电脑</div>
                </button>
                <button class="control-btn sleep-btn" onclick="sendSleep()" id="sleepBtn" style="display:none">
                    <div class="btn-icon"><i class="fas fa-moon"></i></div>
                    <div class="btn-label">睡眠电脑</div>
                </button>
            </div>
        </div>

        <!-- Toast提示 -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        // MQTT配置
        const MQTT_BROKER = 'wss://broker-cn.emqx.io:8083/mqtt';
        let mqttClient = null;
        let deviceId = null;
        let token = null;
        let connected = false;

        // 本地存储
        const STORAGE_KEY = 'wol-mini-config';

        // 页面加载时恢复配置
        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const config = JSON.parse(saved);
                document.getElementById('deviceId').value = config.deviceId || '';
                document.getElementById('token').value = config.token || '';
            }
        });

        // 连接MQTT
        function handleConnect(e) {
            e.preventDefault();

            deviceId = document.getElementById('deviceId').value.trim();
            token = document.getElementById('token').value.trim();

            if (!deviceId || !token) {
                showToast('请填写设备ID和Token', 'error');
                return;
            }

            // 保存配置
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ deviceId, token }));

            // 更新连接状态
            updateMqttStatus('connecting');
            showToast('正在连接...', 'info');

            const btn = document.getElementById('connectBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 连接中...';

            // 创建MQTT客户端
            const clientId = 'web-' + Math.random().toString(16).substr(2, 8);
            mqttClient = mqtt.connect(MQTT_BROKER, {
                clientId: clientId,
                clean: true,
                connectTimeout: 10000,
                reconnectPeriod: 0  // 不自动重连
            });

            mqttClient.on('connect', () => {
                console.log('MQTT connected');
                connected = true;
                updateMqttStatus('connected');
                showToast('连接成功', 'success');
                showMainPanel();

                // 订阅状态Topic
                const statusTopic = `wol/${deviceId}/status`;
                mqttClient.subscribe(statusTopic, { qos: 1 });
                console.log('Subscribed: ' + statusTopic);
            });

            mqttClient.on('message', (topic, message) => {
                console.log('Message:', topic, message.toString());
                try {
                    const data = JSON.parse(message.toString());
                    handleMessage(data);
                } catch (e) {
                    console.error('Parse error:', e);
                }
            });

            mqttClient.on('error', (err) => {
                console.error('MQTT error:', err);
                showToast('连接失败: ' + err.message, 'error');
                updateMqttStatus('error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-link"></i> 连接设备';
            });

            mqttClient.on('close', () => {
                console.log('MQTT closed');
                connected = false;
                if (!document.getElementById('loginPanel').style.display || document.getElementById('loginPanel').style.display !== 'block') {
                    updateMqttStatus('disconnected');
                }
            });
        }

        // 断开连接
        function disconnect() {
            if (mqttClient) {
                mqttClient.end();
                mqttClient = null;
            }
            connected = false;
            showLoginPanel();
            updateMqttStatus('disconnected');
        }

        // 发送唤醒指令
        function sendWake() {
            if (!connected || !mqttClient) {
                showToast('请先连接设备', 'error');
                return;
            }

            const controlTopic = `wol/${deviceId}/control`;
            const message = {
                action: 'wake',
                token: token,
                timestamp: Math.floor(Date.now() / 1000)
            };

            console.log('Publish:', controlTopic, message);
            mqttClient.publish(controlTopic, JSON.stringify(message), { qos: 1 });
            showToast('唤醒指令已发送...', 'info');
        }

        // 发送睡眠指令（可选功能）
        function sendSleep() {
            if (!connected || !mqttClient) {
                showToast('请先连接设备', 'error');
                return;
            }

            const controlTopic = `wol/${deviceId}/control`;
            const message = {
                action: 'sleep',
                token: token,
                timestamp: Math.floor(Date.now() / 1000)
            };

            mqttClient.publish(controlTopic, JSON.stringify(message), { qos: 1 });
            showToast('睡眠指令已发送', 'info');
        }

        // 处理接收消息
        function handleMessage(data) {
            console.log('Handle:', data);

            // 心跳状态
            if (data.status === 'online') {
                updateEsp32Status('online', data.ip || '-');
            }

            // 操作结果
            if (data.result) {
                if (data.result === 'success') {
                    showToast('✓ 操作成功', 'success');
                } else if (data.result === 'rejected') {
                    showToast('Token验证失败，请检查密码', 'error');
                } else {
                    showToast('操作失败: ' + (data.reason || '未知'), 'error');
                }
            }
        }

        // UI更新函数
        function updateMqttStatus(status) {
            const dot = document.getElementById('mqttDot');
            const text = document.getElementById('mqttStatus');

            dot.className = 'status-dot';
            if (status === 'connected') {
                dot.classList.add('connected');
                text.textContent = 'MQTT已连接';
            } else if (status === 'connecting') {
                dot.classList.add('connecting');
                text.textContent = '正在连接...';
            } else {
                text.textContent = '未连接';
            }
        }

        function updateEsp32Status(status, ip) {
            const badge = document.getElementById('esp32Status');
            const ipEl = document.getElementById('esp32Ip');

            badge.className = 'status-badge';
            if (status === 'online') {
                badge.classList.add('online');
                badge.textContent = '在线';
                ipEl.textContent = ip;
            } else {
                badge.classList.add('offline');
                badge.textContent = '离线';
                ipEl.textContent = '-';
            }
        }

        function showMainPanel() {
            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('mainPanel').style.display = 'block';
        }

        function showLoginPanel() {
            document.getElementById('loginPanel').style.display = 'block';
            document.getElementById('mainPanel').style.display = 'none';
            const btn = document.getElementById('connectBtn');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-link"></i> 连接设备';
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
