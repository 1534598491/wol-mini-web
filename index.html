<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOL-Mini 远程唤醒</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { max-width: 400px; width: 100%; padding: 20px; }

        /* 登录面板 */
        .login-panel {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
        }
        .login-panel h2 { margin-bottom: 20px; color: #333; }
        .login-panel .logo { font-size: 48px; color: #667eea; margin-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .login-btn:hover { background: #5a6fd6; }
        .login-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .login-hint { color: #999; font-size: 12px; margin-top: 15px; }

        /* 主面板 */
        .main-panel { display: none; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .header h1 { color: #333; font-size: 20px; }
        .logout-btn {
            background: #f0f0f0;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* 控制按钮 */
        .control-buttons { display: flex; gap: 15px; margin-bottom: 20px; }
        .control-btn {
            flex: 1;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
        }
        .control-btn:hover { transform: translateY(-2px); }
        .wake-btn { background: #22c55e; color: white; }
        .sleep-btn { background: #f97316; color: white; }
        .btn-icon { font-size: 32px; margin-bottom: 8px; }
        .btn-label { font-size: 14px; }

        /* 状态卡片 */
        .status-card {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .status-title { font-size: 18px; color: #333; margin-bottom: 15px; }
        .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .status-badge { padding: 6px 12px; border-radius: 6px; font-size: 12px; }
        .online { background: #22c55e; color: white; }
        .offline { background: #ef4444; color: white; }
        .sleeping { background: #f97316; color: white; }
        .connecting { background: #3b82f6; color: white; }

        /* Toast提示 */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        .toast.show { opacity: 1; }
        .toast.success { background: #22c55e; color: white; }
        .toast.error { background: #ef4444; color: white; }
        .toast.info { background: #3b82f6; color: white; }

        /* 确认弹窗 */
        .confirm-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 300px;
            text-align: center;
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btn { padding: 10px 20px; border-radius: 6px; cursor: pointer; border: none; }
        .cancel-btn { background: #f0f0f0; }
        .confirm-btn { background: #f97316; color: white; }

        /* 连接状态 */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 12px;
            color: #666;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
        }
        .status-dot.connected { background: #22c55e; }
        .status-dot.connecting { background: #3b82f6; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录面板 -->
        <div class="login-panel" id="loginPanel">
            <div class="logo"><i class="fas fa-desktop"></i></div>
            <h2>远程PC控制</h2>
            <form onsubmit="handleConnect(event)">
                <div class="input-group">
                    <input type="text" id="deviceId" placeholder="设备ID" required>
                </div>
                <div class="input-group">
                    <input type="password" id="token" placeholder="Token" required>
                </div>
                <button type="submit" class="login-btn" id="connectBtn">
                    <i class="fas fa-sign-in-alt"></i> 连接
                </button>
            </form>
            <p class="login-hint">设备ID和Token在配网时设置</p>
        </div>

        <!-- 主控制面板 -->
        <div class="main-panel" id="mainPanel">
            <div class="header">
                <h1><i class="fas fa-desktop"></i> 远程PC控制</h1>
                <button class="logout-btn" onclick="disconnect()">
                    <i class="fas fa-sign-out-alt"></i> 断开
                </button>
            </div>

            <!-- 控制按钮 -->
            <div class="control-buttons">
                <button class="control-btn wake-btn" onclick="sendWake()">
                    <div class="btn-icon"><i class="fas fa-power-off"></i></div>
                    <div class="btn-label">唤醒电脑</div>
                </button>
                <button class="control-btn sleep-btn" onclick="showSleepConfirm()">
                    <div class="btn-icon"><i class="fas fa-moon"></i></div>
                    <div class="btn-label">睡眠电脑</div>
                </button>
            </div>

            <!-- 状态卡片 -->
            <div class="status-card">
                <div class="connection-status">
                    <div class="status-dot" id="mqttDot"></div>
                    <span id="mqttStatus">MQTT: 未连接</span>
                </div>
                <div class="status-title">设备状态</div>
                <div class="status-row">
                    <span>ESP32:</span>
                    <span class="status-badge offline" id="esp32Status">离线</span>
                </div>
                <div class="status-row">
                    <span>电脑:</span>
                    <span class="status-badge offline" id="pcStatus">状态未知</span>
                </div>
                <div class="status-row">
                    <span>设备IP:</span>
                    <span id="deviceIp">-</span>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>

        <!-- 睡眠确认弹窗 -->
        <div class="confirm-modal" id="confirmModal">
            <div class="modal-content">
                <h3><i class="fas fa-moon"></i> 确认睡眠</h3>
                <p>确定要让电脑进入睡眠吗？</p>
                <div class="modal-buttons">
                    <button class="modal-btn cancel-btn" onclick="closeModal()">取消</button>
                    <button class="modal-btn confirm-btn" onclick="sendSleep()">确认</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const MQTT_BROKER = 'ws://broker-cn.emqx.io:8083/mqtt';
        let mqttClient = null;
        let deviceId = null;
        let token = null;
        let connected = false;
        let deviceVerified = false;
        let verifyTimeout = null;
        let statusInterval = null;

        const STORAGE_KEY = 'wol-mini-config';

        // 自动重新登录
        function autoConnect(savedDeviceId, savedToken) {
            deviceId = savedDeviceId;
            token = savedToken;

            const btn = document.getElementById('connectBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 自动连接...';

            deviceVerified = false;
            updateMqttStatus('connecting');

            const clientId = 'web-' + Math.random().toString(16).substr(2, 8);
            mqttClient = mqtt.connect(MQTT_BROKER, {
                clientId: clientId,
                clean: true,
                connectTimeout: 5000,
                reconnectPeriod: 0  // 不自动重连，超时后彻底断开
            });

            mqttClient.on('connect', () => {
                console.log('MQTT连接成功');

                const statusTopic = `wol/${deviceId}/status`;
                mqttClient.subscribe(statusTopic, { qos: 1 });

                const controlTopic = `wol/${deviceId}/control`;
                const verifyMsg = { action: 'ping', token: token, timestamp: Math.floor(Date.now() / 1000) };
                mqttClient.publish(controlTopic, JSON.stringify(verifyMsg), { qos: 1 });

                verifyTimeout = setTimeout(() => {
                    if (!deviceVerified) {
                        showToast('设备未响应，请检查设备ID和Token', 'error');
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 连接';
                        updateMqttStatus('disconnected');
                        if (mqttClient) {
                            mqttClient.end(true);  // 强制断开
                            mqttClient = null;
                        }
                    }
                }, 3000);
            });

            mqttClient.on('message', (topic, message) => {
                try {
                    const data = JSON.parse(message.toString());
                    handleMessage(data);
                } catch (e) {
                    console.error('解析错误:', e);
                }
            });

            mqttClient.on('error', (err) => {
                console.error('MQTT错误:', err);
                showToast('连接失败', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 连接';
                updateMqttStatus('disconnected');
            });

            mqttClient.on('close', () => {
                console.log('MQTT断开');
                connected = false;
                if (statusInterval) clearInterval(statusInterval);
            });
        }

        // 加载保存的配置
        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const config = JSON.parse(saved);
                document.getElementById('deviceId').value = config.deviceId || '';
                document.getElementById('token').value = config.token || '';
                // 自动重新登录
                if (config.deviceId && config.token) {
                    autoConnect(config.deviceId, config.token);
                }
            }
        });

        // 连接MQTT
        function handleConnect(e) {
            e.preventDefault();

            deviceId = document.getElementById('deviceId').value.trim();
            token = document.getElementById('token').value.trim();

            if (!deviceId || !token) {
                showToast('请填写设备ID和Token', 'error');
                return;
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify({ deviceId, token }));

            updateMqttStatus('connecting');
            showToast('正在连接...', 'info');

            const btn = document.getElementById('connectBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 连接中...';

            deviceVerified = false;

            const clientId = 'web-' + Math.random().toString(16).substr(2, 8);
            mqttClient = mqtt.connect(MQTT_BROKER, {
                clientId: clientId,
                clean: true,
                connectTimeout: 5000,
                reconnectPeriod: 0  // 验证阶段不自动重连
            });

            mqttClient.on('connect', () => {
                console.log('MQTT连接成功');

                const statusTopic = `wol/${deviceId}/status`;
                mqttClient.subscribe(statusTopic, { qos: 1 });
                console.log('订阅:', statusTopic);

                showToast('正在验证设备...', 'info');

                const controlTopic = `wol/${deviceId}/control`;
                const verifyMsg = { action: 'ping', token: token, timestamp: Math.floor(Date.now() / 1000) };
                mqttClient.publish(controlTopic, JSON.stringify(verifyMsg), { qos: 1 });

                verifyTimeout = setTimeout(() => {
                    if (!deviceVerified) {
                        showToast('设备未响应，请检查ID和Token', 'error');
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 连接';
                        if (mqttClient) mqttClient.end();
                    }
                }, 3000);
            });

            mqttClient.on('message', (topic, message) => {
                console.log('收到:', topic, message.toString());
                try {
                    const data = JSON.parse(message.toString());
                    handleMessage(data);
                } catch (e) {
                    console.error('解析错误:', e);
                }
            });

            mqttClient.on('error', (err) => {
                console.error('MQTT错误:', err);
                showToast('连接失败: ' + err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 连接';
            });

            mqttClient.on('close', () => {
                console.log('MQTT断开');
                connected = false;
                if (statusInterval) clearInterval(statusInterval);
            });
        }

        // 断开连接
        function disconnect() {
            if (mqttClient) mqttClient.end();
            mqttClient = null;
            connected = false;
            deviceVerified = false;
            if (statusInterval) clearInterval(statusInterval);
            showLoginPanel();
        }

        // 处理消息
        function handleMessage(data) {
            console.log('处理:', data);

            // 验证响应
            if (!deviceVerified) {
                if (data.result === 'rejected') {
                    showToast('Token验证失败', 'error');
                    clearTimeout(verifyTimeout);
                    const btn = document.getElementById('connectBtn');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 连接';
                    if (mqttClient) mqttClient.end();
                    return;
                }
                if (data.device_id === deviceId || data.status === 'online') {
                    deviceVerified = true;
                    connected = true;
                    clearTimeout(verifyTimeout);
                    updateMqttStatus('connected');
                    showMainPanel();
                    updateStatus(data);
                    statusInterval = setInterval(requestStatus, 30000);
                    const btn = document.getElementById('connectBtn');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 连接';
                }
                return;
            }

            // 心跳/状态更新（已验证后不再弹提示）
            if (data.status === 'online') {
                updateEsp32Status('online');
                updatePcStatus('online');
                document.getElementById('deviceIp').textContent = data.ip || '-';
            } else if (data.status === 'sleeping') {
                updatePcStatus('sleeping');
            }

            // 操作结果（只在用户主动操作时提示）
            if (data.result === 'success' && data.action) {
                if (data.action === 'wake') {
                    showToast('唤醒指令已发送', 'success');
                    startWakePoll();
                } else if (data.action === 'sleep') {
                    showToast('睡眠指令已发送', 'success');
                    updatePcStatus('sleeping');
                }
            } else if (data.result === 'rejected') {
                showToast('Token验证失败', 'error');
            }
        }

        // 发送唤醒
        function sendWake() {
            if (!connected) return showToast('未连接设备', 'error');

            const msg = { action: 'wake', token: token, timestamp: Math.floor(Date.now() / 1000) };
            mqttClient.publish(`wol/${deviceId}/control`, JSON.stringify(msg), { qos: 1 });
            showToast('正在发送唤醒指令...', 'info');
        }

        // 唤醒轮询
        let wakePollTimer = null;
        function startWakePoll() {
            if (wakePollTimer) clearInterval(wakePollTimer);
            let count = 0;
            wakePollTimer = setInterval(() => {
                count++;
                if (count >= 20) { // 60秒超时
                    clearInterval(wakePollTimer);
                    showToast('唤醒超时，请检查PC配置', 'error');
                    return;
                }
                requestStatus();
            }, 3000);
        }

        // 发送睡眠
        function showSleepConfirm() {
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        function sendSleep() {
            closeModal();
            if (!connected) return showToast('未连接设备', 'error');

            const msg = { action: 'sleep', token: token, timestamp: Math.floor(Date.now() / 1000) };
            mqttClient.publish(`wol/${deviceId}/control`, JSON.stringify(msg), { qos: 1 });
            showToast('正在发送睡眠指令...', 'info');
        }

        // 请求状态
        function requestStatus() {
            if (!connected || !mqttClient) return;
            const msg = { action: 'status', token: token, timestamp: Math.floor(Date.now() / 1000) };
            mqttClient.publish(`wol/${deviceId}/control`, JSON.stringify(msg), { qos: 1 });
        }

        // 更新状态显示
        function updateStatus(data) {
            if (data.ip) document.getElementById('deviceIp').textContent = data.ip;
            updateEsp32Status('online');
        }

        function updateEsp32Status(status) {
            const badge = document.getElementById('esp32Status');
            badge.className = 'status-badge ' + (status === 'online' ? 'online' : 'offline');
            badge.textContent = status === 'online' ? '在线' : '离线';
        }

        function updatePcStatus(status) {
            const badge = document.getElementById('pcStatus');
            if (status === 'online') {
                badge.className = 'status-badge online';
                badge.textContent = '开机';
                if (wakePollTimer) clearInterval(wakePollTimer);
            } else if (status === 'sleeping') {
                badge.className = 'status-badge sleeping';
                badge.textContent = '睡眠中';
            } else {
                badge.className = 'status-badge offline';
                badge.textContent = '状态未知';
            }
        }

        function updateMqttStatus(status) {
            const dot = document.getElementById('mqttDot');
            const text = document.getElementById('mqttStatus');
            dot.className = 'status-dot';
            if (status === 'connected') {
                dot.classList.add('connected');
                text.textContent = 'MQTT: 已连接';
            } else if (status === 'connecting') {
                dot.classList.add('connecting');
                text.textContent = 'MQTT: 连接中';
            } else {
                text.textContent = 'MQTT: 未连接';
            }
        }

        function showMainPanel() {
            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('mainPanel').style.display = 'block';
        }

        function showLoginPanel() {
            document.getElementById('loginPanel').style.display = 'block';
            document.getElementById('mainPanel').style.display = 'none';
            const btn = document.getElementById('connectBtn');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 连接';
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
